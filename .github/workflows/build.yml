name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            configure: cmake -S . -B build -A x64
            package_dir: windows-amd64
            binary: mod.dll
            zip_name: sfa-hd-text-1.2.1-windows-x64.zip
            artifact: sfa-hd-text-1.2.1-windows-x64

          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            package_dir: linux-amd64
            binary: mod.so
            zip_name: sfa-hd-text-1.2.1-linux-x64.zip
            artifact: sfa-hd-text-1.2.1-linux-x64

          - name: macOS Apple Silicon
            os: macos-15
            platform: macos-arm64
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            package_dir: macos-arm64
            binary: mod.so
            zip_name: sfa-hd-text-1.2.1-macos-arm64.zip
            artifact: sfa-hd-text-1.2.1-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -f build/sfa-hd-text/mod.json
          test -f build/sfa-hd-text/assets/glyphs.bin
          test -f "build/sfa-hd-text/lib/${{ matrix.package_dir }}/${{ matrix.binary }}"
          find build/sfa-hd-text -maxdepth 5 -type f -print

      - name: Verify Linux binary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="build/sfa-hd-text/lib/linux-amd64/mod.so"
          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit'
          file "$bin" | grep -Eq 'x86-64|x86_64'
          nm -D --defined-only "$bin" | grep -Eq '[[:space:]]fh_mod_initialize$'
          nm -D --defined-only "$bin" | grep -Eq '[[:space:]]fh_mod_update$'
          nm -D --defined-only "$bin" | grep -Eq '[[:space:]]fh_mod_shutdown$'

      - name: Verify macOS binary
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          bin="build/sfa-hd-text/lib/macos-arm64/mod.so"
          file "$bin"
          archs="$(lipo -archs "$bin")"
          echo "Architectures: $archs"
          echo "$archs" | grep -qw arm64
          ! echo "$archs" | grep -qw x86_64
          nm -gU "$bin" | grep -Eq '[_]fh_mod_initialize$'
          nm -gU "$bin" | grep -Eq '[_]fh_mod_update$'
          nm -gU "$bin" | grep -Eq '[_]fh_mod_shutdown$'
          otool -L "$bin"

      - name: Verify Windows binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "build/sfa-hd-text/lib/windows-amd64/mod.dll"
          if (-not (Test-Path $bin)) { throw "Missing $bin" }
          $bytes = [System.IO.File]::ReadAllBytes($bin)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a PE/MZ binary" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE binary" }

      - name: Assemble platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "platform-package/sfa-hd-text/assets"
          mkdir -p "platform-package/sfa-hd-text/lib/${{ matrix.package_dir }}"
          cp mod.json README.md LICENSE platform-package/sfa-hd-text/
          cp assets/glyphs.bin platform-package/sfa-hd-text/assets/
          cp -R textures platform-package/sfa-hd-text/textures
          cp "build/sfa-hd-text/lib/${{ matrix.package_dir }}/${{ matrix.binary }}"              "platform-package/sfa-hd-text/lib/${{ matrix.package_dir }}/${{ matrix.binary }}"

      - name: Create platform ZIP
        shell: bash
        run: |
          cd platform-package
          cmake -E tar cfv "../${{ matrix.zip_name }}" --format=zip sfa-hd-text

      - name: Upload platform ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip_name }}
          compression-level: 0

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p native-binary
          cp "build/sfa-hd-text/lib/${{ matrix.package_dir }}/${{ matrix.binary }}" native-binary/

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package_dir }}
          path: native-binary/${{ matrix.binary }}
          compression-level: 0

  combined:
    name: Combined Foxhollow package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: native-windows-amd64
          path: package/sfa-hd-text/lib/windows-amd64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux-amd64
          path: package/sfa-hd-text/lib/linux-amd64

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: native-macos-arm64
          path: package/sfa-hd-text/lib/macos-arm64

      - name: Assemble complete pack
        shell: bash
        run: |
          mkdir -p package/sfa-hd-text/assets
          cp mod.json README.md LICENSE package/sfa-hd-text/
          cp assets/glyphs.bin package/sfa-hd-text/assets/
          cp -R textures package/sfa-hd-text/textures

      - name: Verify combined package
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sfa-hd-text/mod.json
          test -f package/sfa-hd-text/assets/glyphs.bin
          test -f package/sfa-hd-text/lib/windows-amd64/mod.dll
          test -f package/sfa-hd-text/lib/linux-amd64/mod.so
          test -f package/sfa-hd-text/lib/macos-arm64/mod.so
          test -d package/sfa-hd-text/textures
          find package/sfa-hd-text/lib -type f -print

      - name: Create all-platforms ZIP
        shell: bash
        run: |
          cd package
          cmake -E tar cfv ../sfa-hd-text-1.2.1-all-platforms.zip --format=zip sfa-hd-text

      - name: Create Foxhollow .fox bundle
        shell: bash
        run: |
          cd package/sfa-hd-text
          cmake -E tar cfv ../../sfa-hd-text-1.2.1.fox --format=zip mod.json assets textures lib README.md LICENSE

      - name: Upload all-platforms ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sfa-hd-text-1.2.1-all-platforms
          path: sfa-hd-text-1.2.1-all-platforms.zip
          compression-level: 0

      - name: Upload Foxhollow .fox bundle
        uses: actions/upload-artifact@v4
        with:
          name: sfa-hd-text-1.2.1-fox-bundle
          path: sfa-hd-text-1.2.1.fox
          compression-level: 0
