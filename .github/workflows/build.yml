name: Package HD world textures
on:
  push:
    branches: [main, codex/hd-textures]
  pull_request:
    branches: [main, codex/hd-textures]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Package
        run: cmake --build build --target package
      - name: Verify texture-only package
        shell: bash
        run: |
          test -f build/package/sfa-hd-textures/mod.json
          test -d build/package/sfa-hd-textures/textures
          test ! -d build/package/sfa-hd-textures/lib
          test ! -d build/package/sfa-hd-textures/textures/Text
          test ! -d build/package/sfa-hd-textures/textures/Icons
      - uses: actions/upload-artifact@v4
        with:
          name: sfa-hd-textures-1.2.0
          path: build/dist/*
          compression-level: 0
